<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Exames</title>
    <!-- Referência ao seu CSS customizado -->
    <link href="/css/styles.css" rel="stylesheet" type="text/css">
    <!-- Font Awesome para ícones -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <h1>Exames</h1>
    <!-- Botão Voltar -->
    <a href="/" class="btn-voltar">
        <i class="fas fa-home icon icon-back"></i> Voltar
    </a>
    <!-- Ícone de Novo Exame -->
    <a href="/exame-ui/novo" class="btn-novo-exame">
        <i class="fas fa-plus-circle icon icon-new"></i> Novo Exame
    </a>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome do Exame</th>
                <th>Data de Realização</th>
                <th>Resultado</th>
                <th>Paciente</th>
                <th>Médico</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="exame : ${exames}">
                <td th:text="${exame.id}"></td>
                <td th:text="${exame.nome}"></td>
                <td th:text="${exame.dataRealizacao}"></td>
                <td th:text="${exame.resultado}"></td>
                <td th:text="${exame.paciente.nome}"></td>
                <td th:text="${exame.medico.nome}"></td>
                <td>
                    <!-- Ícone de Editar -->
                    <a th:href="@{/exame-ui/editar/{id}(id=${exame.id})}">
                        <i class="fas fa-edit icon icon-edit"></i> Editar
                    </a>
                    |
                    <!-- Ícone de Excluir -->
                    <a th:href="@{/exame-ui/excluir/{id}(id=${exame.id})}">
                        <i class="fas fa-trash icon icon-delete"></i> Excluir
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
