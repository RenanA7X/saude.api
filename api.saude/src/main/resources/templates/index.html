<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel de Navegação</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #333;
        }
        nav a {
            padding: 14px 20px;
            color: white;
            text-decoration: none;
            text-align: center;
            flex: 1;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }
        .container {
            margin: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Bem-vindo ao Sistema de Saúde</h1>
    <p>Selecione uma opção no menu abaixo para gerenciar médicos, pacientes e exames</p>
</header>

<nav>
    <a th:href="@{/exame-ui}">Exames</a>
    <a th:href="@{/medico-ui}">Médicos</a>
    <a th:href="@{/paciente-ui}">Pacientes</a>
    <a th:href="@{/agendamento-ui}">Agendamentos</a>
</nav>

<div class="container">
    <h2>Menu de Navegação</h2>
    <p>Escolha uma opção acima para acessar os respectivos cadastros.</p>
</div>

</body>
</html>
